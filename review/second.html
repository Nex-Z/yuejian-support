<h1>第二章　灯影</h1>
<article><p>傍晚，船头轻轻碰了两下石岸。船上的婆婆一眼认出那只瓢，笑着把它收到篮里，换了一小把菱角在台阶上。</p>
<p>阿青坐在系船柱旁剥菱角。对岸的灯亮起来，他也点起自己的风灯，把芯拨低，等最后一个过河的人。</p></article>
