<h1>第一章　水线</h1>
<article><p>雨歇的时候，渡口的石阶才露出第三级。阿青在湿木板上划了一道细线，记下河水退去的位置。</p>
<p>一只瓢从桥洞漂出来。他用竹篙把它拢到岸边，扣在台阶上。等船回来，兴许有人认得它。</p></article>
